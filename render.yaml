
services:
  - type: web
    name: config-precedence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_WORKERS
        value: "15"
      - key: APP_LOG_LEVEL
        value: info
      - key: APP_API_KEY
        sync: false
